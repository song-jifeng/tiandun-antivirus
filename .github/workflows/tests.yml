name: Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 2>/dev/null || pip install psutil pyqt5 pytest

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short --ignore=tests/test_extended.py

    - name: Run extended tests
      run: |
        python -m pytest tests/test_extended.py -v --tb=short -x || echo "Extended tests may have optional failures"